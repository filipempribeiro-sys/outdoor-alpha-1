<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b0f">
<title>OLEN · UX Lab 01</title>
<style>
:root{--bg:#090b0f;--panel:#12151b;--panel2:#191d24;--text:#f7f8fa;--muted:#9097a3;--line:rgba(255,255,255,.08);--accent:#f7f8fa;--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit;color:inherit}
body{min-height:100dvh}.app{min-height:100dvh;max-width:520px;margin:auto;position:relative;overflow:hidden;background:radial-gradient(circle at 70% 15%,rgba(255,255,255,.045),transparent 28%),var(--bg)}
.wordmark{display:inline-flex;align-items:center;gap:8px;font-weight:760;letter-spacing:.18em;font-size:22px}.mark{width:31px;height:31px;display:block}.wordmark .letters{margin-left:-2px}
.intro{position:fixed;z-index:50;inset:0;background:#090b0f;display:grid;place-items:center;transition:opacity .42s ease,visibility .42s ease}.intro.done{opacity:0;visibility:hidden;pointer-events:none}.intro .brand{transform:scale(.94);opacity:0;animation:intro .85s cubic-bezier(.2,.8,.2,1) forwards}.intro small{display:block;text-align:center;color:var(--muted);letter-spacing:.08em;margin-top:18px;font-size:12px}@keyframes intro{55%{opacity:1;transform:scale(1.04)}100%{opacity:1;transform:scale(1)}}
main{padding:calc(24px + env(safe-area-inset-top,0px)) 22px calc(112px + var(--safe-b))}
.top{display:flex;align-items:center;justify-content:space-between}.top-actions{display:flex;gap:8px}.iconbtn{width:42px;height:42px;border:1px solid var(--line);background:rgba(255,255,255,.035);border-radius:15px;display:grid;place-items:center}
.hello{margin-top:38px;color:var(--muted);font-size:17px}.name{font-size:36px;line-height:1.05;font-weight:650;margin-top:3px;letter-spacing:-.04em}
.hero{margin-top:34px;padding:24px;border-radius:28px;background:linear-gradient(145deg,#171b22,#0f1217);border:1px solid var(--line);min-height:250px;display:flex;flex-direction:column;justify-content:space-between}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.16em;color:var(--muted)}.hero h1{font-size:31px;line-height:1.06;letter-spacing:-.04em;margin:12px 0 10px;max-width:330px}.hero p{color:#aeb4bd;line-height:1.45;margin:0;max-width:360px}.ask{margin-top:22px;border:0;background:#f4f5f7;color:#0b0d10;border-radius:18px;padding:15px 18px;font-weight:700;display:flex;justify-content:space-between;align-items:center;width:100%}
.section-title{margin:28px 2px 13px;display:flex;align-items:center;justify-content:space-between}.section-title strong{font-size:17px}.section-title span{font-size:13px;color:var(--muted)}
.quick{display:flex;gap:11px;overflow:auto;padding:1px 1px 8px;scrollbar-width:none}.quick::-webkit-scrollbar{display:none}.q{flex:0 0 142px;height:104px;border:1px solid var(--line);border-radius:22px;background:var(--panel);padding:15px;text-align:left}.q b{display:block;margin-top:19px;font-size:14px}.q span{color:var(--muted);font-size:12px}
.footer{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:0;width:min(520px,100%);padding:10px 12px calc(10px + var(--safe-b));background:rgba(12,14,18,.9);backdrop-filter:blur(24px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);gap:2px}.nav{border:0;background:transparent;color:#737b87;min-height:60px;border-radius:17px;display:grid;place-items:center;align-content:center;gap:5px;font-size:11px}.nav svg{width:23px;height:23px}.nav.active{color:#fff;background:rgba(255,255,255,.065)}.nav.chat{position:relative}.nav.chat:before{content:"";position:absolute;top:-5px;width:34px;height:3px;border-radius:9px;background:#fff;opacity:.9}
@media(min-width:700px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
</style>
</head>
<body>
<div class="intro" id="intro">
  <div class="brand">
    <div class="wordmark" style="font-size:32px;gap:10px">
      <svg class="mark" style="width:45px;height:45px" viewBox="0 0 64 64" aria-label="OLEN"><circle cx="32" cy="32" r="29" fill="none" stroke="currentColor" stroke-width="3"/><path d="M18 25l14 17 15-24" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M47 9l2.5 5.5L55 17l-5.5 2.5L47 25l-2.5-5.5L39 17l5.5-2.5z" fill="currentColor"/></svg>
      <span class="letters">LEN</span>
    </div>
    <small>OUTDOOR · INTELLIGENCE</small>
  </div>
</div>
<div class="app">
<main>
  <header class="top">
    <div class="wordmark">
      <svg class="mark" viewBox="0 0 64 64"><circle cx="32" cy="32" r="29" fill="none" stroke="currentColor" stroke-width="3"/><path d="M18 25l14 17 15-24" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M47 9l2.5 5.5L55 17l-5.5 2.5L47 25l-2.5-5.5L39 17l5.5-2.5z" fill="currentColor"/></svg><span class="letters">LEN</span>
    </div>
    <div class="top-actions"><button class="iconbtn" aria-label="Notificações">⌁</button><button class="iconbtn" aria-label="Perfil">◎</button></div>
  </header>
  <div class="hello">Bom dia,</div><div class="name">Filipe</div>
  <section class="hero">
    <div><div class="eyebrow">Hoje</div><h1>O que queres fazer?</h1><p>Diz-me uma ideia. Eu trato do percurso, contexto e detalhes para a transformar numa experiência.</p></div>
    <button class="ask" id="ask">Falar com a OLEN <span>→</span></button>
  </section>
  <div class="section-title"><strong>Para começar</strong><span>Ver mais</span></div>
  <div class="quick">
    <button class="q"><span>Explorar</span><b>Perto de mim</b></button>
    <button class="q"><span>Outdoor</span><b>Criar percurso</b></button>
    <button class="q"><span>Continuar</span><b>Experiência ativa</b></button>
  </div>
</main>
<nav class="footer" aria-label="Navegação principal">
  <button class="nav active" data-view="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11.5L12 4l9 7.5V21h-6v-6H9v6H3z"/></svg><span>Início</span></button>
  <button class="nav" data-view="map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 18l-6 3V6l6-3 6 3 6-3v15l-6 3zM9 3v15m6-12v15"/></svg><span>Mapa</span></button>
  <button class="nav chat" data-view="chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16v11H9l-5 4z"/></svg><span>OLEN</span></button>
  <button class="nav" data-view="agenda"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18"/></svg><span>Agenda</span></button>
  <button class="nav" data-view="profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c.8-4.5 3.5-7 8-7s7.2 2.5 8 7"/></svg><span>Perfil</span></button>
</nav>
</div>
<script>
const intro=document.getElementById('intro');setTimeout(()=>intro.classList.add('done'),1250);
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));b.classList.add('active')});
document.getElementById('ask').onclick=()=>document.querySelector('[data-view="chat"]').click();
</script>
</body></html>
