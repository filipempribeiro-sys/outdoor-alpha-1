<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06120f">
<title>OLEN · UX Lab 02</title>
<style>
:root{--bg:#06120f;--bg2:#081a16;--panel:#0c211b;--panel2:#102820;--text:#f6f8f7;--muted:#91a49e;--line:rgba(255,255,255,.09);--green:#52e6aa;--cyan:#63f3e1;--violet:#a96cff;--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#030907;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit;color:inherit}
body{min-height:100dvh}.app{min-height:100dvh;max-width:520px;margin:auto;position:relative;overflow:hidden;background:radial-gradient(circle at 78% 10%,rgba(75,224,164,.08),transparent 28%),linear-gradient(180deg,var(--bg),#040a08 76%)}
.aurora{background:linear-gradient(125deg,var(--cyan) 5%,#6cc9ff 48%,var(--violet) 95%)}
.wordmark{display:inline-flex;align-items:center;gap:7px;font-weight:760;letter-spacing:.16em;font-size:22px}.mark{width:32px;height:32px;display:block}.letters{margin-left:-2px}
.intro{position:fixed;z-index:80;inset:0;background:radial-gradient(circle at 50% 35%,rgba(82,230,170,.08),transparent 30%),#04100d;display:grid;place-items:center;transition:opacity .34s ease,visibility .34s ease}.intro.done{opacity:0;visibility:hidden;pointer-events:none}.intro-brand{display:grid;justify-items:center}.intro-wordmark{display:inline-flex;align-items:center;gap:9px;font-size:33px;font-weight:760;letter-spacing:.16em}.intro-mark{width:47px;height:47px;overflow:visible}.intro-ring{stroke:url(#introGradient);stroke-dasharray:170;stroke-dashoffset:170;animation:ringDraw .46s cubic-bezier(.3,.75,.25,1) .06s forwards}.intro-chevron{stroke:url(#introGradient);stroke-dasharray:48;stroke-dashoffset:48;opacity:0;transform:translateX(-5px);transform-origin:center;animation:chevronGo .32s cubic-bezier(.2,.9,.3,1) .36s forwards}.intro-star{fill:url(#introGradient);opacity:0;transform:scale(.15) rotate(-18deg);transform-origin:48px 16px;animation:starPop .3s cubic-bezier(.2,1.4,.3,1) .58s forwards}.intro-letters{display:inline-block;margin-left:-2px;opacity:0;transform:translateX(-8px);animation:lettersIn .34s cubic-bezier(.2,.8,.2,1) .68s forwards}.intro small{display:block;text-align:center;color:#a4b3ae;letter-spacing:.26em;margin-top:17px;font-size:10px;opacity:0;transform:translateY(4px);animation:tagIn .28s ease .86s forwards}@keyframes ringDraw{to{stroke-dashoffset:0}}@keyframes chevronGo{to{stroke-dashoffset:0;opacity:1;transform:translateX(0)}}@keyframes starPop{70%{opacity:1;transform:scale(1.18) rotate(5deg)}100%{opacity:1;transform:scale(1) rotate(0)}}@keyframes lettersIn{to{opacity:1;transform:translateX(0)}}@keyframes tagIn{to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.intro-ring,.intro-chevron,.intro-star,.intro-letters,.intro small{animation-duration:.01ms;animation-delay:0s}.intro{transition-duration:.01ms}}
main{padding:calc(23px + env(safe-area-inset-top,0px)) 20px calc(116px + var(--safe-b))}
.top{display:flex;align-items:center;justify-content:space-between}.top-actions{display:flex;gap:9px}.iconbtn{width:41px;height:41px;border:1px solid var(--line);background:rgba(255,255,255,.035);border-radius:50%;display:grid;place-items:center}
.hello{margin-top:33px;color:#b1beb9;font-size:16px}.name{font-size:35px;line-height:1.05;font-weight:680;margin-top:2px;letter-spacing:-.04em}
.hero{margin-top:28px;min-height:260px;border-radius:27px;overflow:hidden;position:relative;border:1px solid var(--line);background:linear-gradient(145deg,#143b2d,#07130f)}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 72% 18%,rgba(102,243,225,.15),transparent 28%),linear-gradient(0deg,rgba(3,10,8,.9),rgba(3,10,8,.1) 70%)}
.hero-content{position:relative;z-index:1;height:100%;min-height:260px;padding:23px;display:flex;flex-direction:column;justify-content:flex-end}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.17em;color:#b7c6c1}.hero h1{font-size:31px;line-height:1.04;letter-spacing:-.04em;margin:8px 0}.hero p{color:#b6c1bd;line-height:1.4;margin:0;font-size:14px}.ask{margin-top:19px;border:0;border-radius:17px;padding:15px 18px;font-weight:760;color:#07110e;display:flex;justify-content:space-between;align-items:center;width:100%;background:linear-gradient(105deg,var(--cyan),#72d8ff 48%,var(--violet))}
.section-title{margin:27px 2px 13px;display:flex;align-items:center;justify-content:space-between}.section-title strong{font-size:17px}.section-title span{font-size:12px;color:var(--green)}
.quick{display:flex;gap:11px;overflow:auto;padding:1px 1px 8px;scrollbar-width:none}.quick::-webkit-scrollbar{display:none}.q{flex:0 0 145px;height:108px;border:1px solid var(--line);border-radius:21px;background:var(--panel);padding:15px;text-align:left}.q b{display:block;margin-top:20px;font-size:14px}.q span{color:var(--muted);font-size:12px}
.footer{--active:0;position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:0;width:min(520px,100%);height:calc(82px + var(--safe-b));padding:12px 9px calc(8px + var(--safe-b));background:rgba(5,15,12,.94);backdrop-filter:blur(24px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr)}
.indicator{position:absolute;z-index:0;top:-19px;left:calc((100% / 5) * var(--active) + (100% / 10) - 28px);width:56px;height:56px;border-radius:50%;padding:2px;background:linear-gradient(135deg,var(--cyan),#6fc8ff 52%,var(--violet));box-shadow:0 8px 26px rgba(89,224,207,.18);transition:left .42s cubic-bezier(.22,.9,.3,1.12)}
.indicator:after{content:"";display:block;width:100%;height:100%;border-radius:50%;background:#071511;border:5px solid #07110e}
.nav{position:relative;z-index:1;border:0;background:transparent;color:#75837e;min-height:58px;display:grid;place-items:center;align-content:center;gap:5px;font-size:10.5px;transition:color .25s ease,transform .42s cubic-bezier(.22,.9,.3,1.12)}.nav svg{width:22px;height:22px;transition:width .35s,height .35s,transform .35s}.nav.active{color:#f7fffc;transform:translateY(-14px)}.nav.active svg{width:27px;height:27px;filter:drop-shadow(0 0 8px rgba(99,243,225,.35))}.nav.active span{transform:translateY(13px);color:#d8e5e0}.nav span{transition:transform .35s,color .25s}
@media(min-width:700px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
</style>
</head>
<body>
<div class="intro" id="intro"><div class="intro-brand"><div class="intro-wordmark">
<svg class="intro-mark" viewBox="0 0 64 64" aria-label="OLEN"><defs><linearGradient id="introGradient" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#63f3e1"/><stop offset=".5" stop-color="#70c9ff"/><stop offset="1" stop-color="#a96cff"/></linearGradient></defs><circle class="intro-ring" cx="32" cy="32" r="27" fill="none" stroke-width="4"/><path class="intro-chevron" d="M19 24l13 17 14-22" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path class="intro-star" d="M48 8l2.4 5.5L56 16l-5.6 2.5L48 24l-2.5-5.5L40 16l5.5-2.5z"/></svg><span class="intro-letters">LEN</span></div><small>EXPLORA · VIVE · PARTILHA</small></div></div>
<div class="app">
<main>
<header class="top"><div class="wordmark"><svg class="mark" viewBox="0 0 64 64"><defs><linearGradient id="brandGradient" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#63f3e1"/><stop offset=".5" stop-color="#70c9ff"/><stop offset="1" stop-color="#a96cff"/></linearGradient></defs><circle cx="32" cy="32" r="27" fill="none" stroke="url(#brandGradient)" stroke-width="4"/><path d="M19 24l13 17 14-22" fill="none" stroke="url(#brandGradient)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M48 8l2.4 5.5L56 16l-5.6 2.5L48 24l-2.5-5.5L40 16l5.5-2.5z" fill="url(#brandGradient)"/></svg><span class="letters">LEN</span></div><div class="top-actions"><button class="iconbtn" aria-label="Notificações">♢</button><button class="iconbtn" aria-label="Perfil">◎</button></div></header>
<div class="hello">Bom dia,</div><div class="name">Filipe</div>
<section class="hero"><div class="hero-content"><div class="eyebrow">Hoje</div><h1>O que queres fazer?</h1><p>Explora destinos, atividades e experiências à tua maneira.</p><button class="ask" id="ask">Falar com a OLEN <span>→</span></button></div></section>
<div class="section-title"><strong>Experiências para ti</strong><span>Ver todas ›</span></div>
<div class="quick"><button class="q"><span>Natureza</span><b>Sintra</b></button><button class="q"><span>Mar · Trilhos</span><b>Arrábida</b></button><button class="q"><span>Descobrir</span><b>Perto de mim</b></button></div>
</main>
<nav class="footer" id="footer" aria-label="Navegação principal">
<div class="indicator" aria-hidden="true"></div>
<button class="nav active" data-index="0" data-view="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11.5L12 4l9 7.5V21h-6v-6H9v6H3z"/></svg><span>Início</span></button>
<button class="nav" data-index="1" data-view="map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 18l-6 3V6l6-3 6 3 6-3v15l-6 3zM9 3v15m6-12v15"/></svg><span>Mapa</span></button>
<button class="nav" data-index="2" data-view="chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16v11H9l-5 4z"/></svg><span>Chat</span></button>
<button class="nav" data-index="3" data-view="agenda"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18"/></svg><span>Agenda</span></button>
<button class="nav" data-index="4" data-view="profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c.8-4.5 3.5-7 8-7s7.2 2.5 8 7"/></svg><span>Perfil</span></button>
</nav>
</div>
<script>
const intro=document.getElementById('intro'),footer=document.getElementById('footer');
setTimeout(()=>intro.classList.add('done'),1350);
function selectNav(button){document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));button.classList.add('active');footer.style.setProperty('--active',button.dataset.index)}
document.querySelectorAll('.nav').forEach(b=>b.addEventListener('click',()=>selectNav(b)));
document.getElementById('ask').addEventListener('click',()=>selectNav(document.querySelector('[data-view="chat"]')));
</script>
</body></html>
