<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="olen-runtime" content="5.0">
<title>OLEN 5</title>
<style>html,body{margin:0;width:100%;height:100%;background:#071116}iframe{display:block;border:0;width:100%;height:100dvh;background:#071116}</style>
</head>
<body>
<iframe id="olenLegacyApp" src="./index.html" title="OLEN" allow="geolocation; clipboard-write; web-share"></iframe>
<script>
/* Reversible production cutover host. index.html remains untouched.
   ?cutoverTest=1 runs deterministic browser contracts after activation and
   intentionally rolls OLEN 5 back to the exact legacy presentation state.
   No Reality/Render/provider request is performed by this validation path. */
(()=>{
'use strict';
const frame=document.getElementById('olenLegacyApp');
const runtime=['js/olen-runtime-loader.js','js/olen-production-entry.js'];
const wantsContractTest=()=>{try{return new URLSearchParams(location.search).get('cutoverTest')==='1'}catch{return false}};
function inject(doc,src){return new Promise((resolve,reject)=>{const s=doc.createElement('script');s.src=src;s.async=false;s.onload=resolve;s.onerror=()=>reject(new Error('olen5_entry_load_failed:'+src));doc.head.appendChild(s)})}
function setState(state){document.documentElement.dataset.olen5Host=state}
frame.addEventListener('load',async()=>{
 try{
  const win=frame.contentWindow,doc=frame.contentDocument;
  if(!win||!doc)throw new Error('olen5_legacy_document_unavailable');
  setState('loading');
  for(const src of runtime)await inject(doc,src);
  const entry=win.OLEN5?.productionEntry;
  if(!entry?.boot)throw new Error('olen5_production_entry_missing');
  const result=await entry.boot({force:true,legacyDom:true,initialView:'home',replaceHistory:true});
  if(!result?.ok||!result?.active)throw new Error(result?.reason||'olen5_cutover_refused');
  setState('active');
  win.dispatchEvent(new win.CustomEvent('olen5:production-entry-active',{detail:{host:'olen-5-entry.html',version:result.version}}));
  if(wantsContractTest()){
   await inject(doc,'js/olen-cutover-contract-test.js');
   const report=await win.OLEN5?.cutoverContractTest?.run?.();
   win.__OLEN5_CUTOVER_TEST__=report||{ok:false,score:'0/0',results:[]};
   document.documentElement.dataset.olen5Contract=report?.ok?'passed':'failed';
   setState('legacy-tested');
   console.info('[OLEN 5 cutover contract]',report);
  }
 }catch(error){
  setState('legacy');
  console.error('[OLEN 5 entry] cutover refused; legacy runtime preserved',error);
 }
},{once:true});
})();
</script>
</body>
</html>
