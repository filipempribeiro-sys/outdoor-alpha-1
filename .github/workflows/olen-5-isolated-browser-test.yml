name: OLEN 5.0 isolated browser test

on:
  workflow_dispatch:

jobs:
  isolated-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run OLEN 5.0 isolated and reversible production cutover contracts
        run: |
          python3 -m http.server 4173 >/tmp/olen5-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:412,height:915}, deviceScaleFactor:2, isMobile:true, hasTouch:true});
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('console',m=>console.log(`[browser:${m.type()}] ${m.text()}`));
            await page.goto('http://127.0.0.1:4173/olen-5-shell.html?test=1&experienceTest=1&contextTest=1&entitlementTest=1&mobilityTest=1&researchTest=1&providerTest=1',{waitUntil:'load'});
            await page.waitForFunction(()=>window.__OLEN5_TEST_REPORT__&&window.__OLEN5_EXPERIENCE_TEST_REPORT__&&window.__OLEN5_CONTEXT_TEST_REPORT__&&window.__OLEN5_ENTITLEMENT_TEST_REPORT__&&window.__OLEN5_MOBILITY_TEST_REPORT__&&window.__OLEN5_RESEARCH_TEST_REPORT__&&window.__OLEN5_PROVIDER_TEST_REPORT__,null,{timeout:10000});
            const reports=await page.evaluate(()=>({ui:window.__OLEN5_TEST_REPORT__,experience:window.__OLEN5_EXPERIENCE_TEST_REPORT__,context:window.__OLEN5_CONTEXT_TEST_REPORT__,entitlement:window.__OLEN5_ENTITLEMENT_TEST_REPORT__,mobility:window.__OLEN5_MOBILITY_TEST_REPORT__,research:window.__OLEN5_RESEARCH_TEST_REPORT__,provider:window.__OLEN5_PROVIDER_TEST_REPORT__}));
            for(const [name,report] of Object.entries(reports)) console.log(`OLEN5_${name.toUpperCase()}_REPORT=${JSON.stringify(report)}`);
            const expected={ui:'5/5',experience:'7/7',context:'6/6',entitlement:'8/8',mobility:'8/8',research:'8/8',provider:'8/8'};
            for(const [name,score] of Object.entries(expected)) if(!reports[name]||reports[name].score!==score||reports[name].ok!==true) throw new Error(`isolated_${name}_failed`);

            const cutover=await browser.newPage({viewport:{width:412,height:915},deviceScaleFactor:2,isMobile:true,hasTouch:true});
            const cutoverErrors=[];
            cutover.on('pageerror',e=>cutoverErrors.push(String(e)));
            cutover.on('console',m=>console.log(`[cutover:${m.type()}] ${m.text()}`));
            await cutover.goto('http://127.0.0.1:4173/olen-5-entry.html?cutoverTest=1',{waitUntil:'load'});
            await cutover.waitForFunction(()=>{const f=document.getElementById('olenLegacyApp');return f?.contentWindow?.__OLEN5_CUTOVER_TEST__},null,{timeout:15000});
            const cutoverReport=await cutover.evaluate(()=>document.getElementById('olenLegacyApp').contentWindow.__OLEN5_CUTOVER_TEST__);
            console.log('OLEN5_CUTOVER_REPORT='+JSON.stringify(cutoverReport));
            if(!cutoverReport||cutoverReport.ok!==true||cutoverReport.score!=='8/8') throw new Error('cutover_contract_failed');
            if(cutoverErrors.length) throw new Error('cutover_page_errors:'+JSON.stringify(cutoverErrors));
            if(errors.length) throw new Error('isolated_page_errors:'+JSON.stringify(errors));
            await browser.close();
          })().catch(err=>{console.error(err);process.exit(1)});
          NODE
