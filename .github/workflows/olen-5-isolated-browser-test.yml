name: OLEN 5.0 isolated browser test

on:
  push:
    branches: [main]
    paths:
      - 'olen-5-shell.html'
      - 'css/olen-5-shell.css'
      - 'js/olen-*.js'
      - '.github/workflows/olen-5-isolated-browser-test.yml'
  workflow_dispatch:

jobs:
  isolated-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run OLEN 5.0 isolated UI 5/5 + Experience 7/7 + Context 6/6 + Entitlement 8/8 contracts
        run: |
          python3 -m http.server 4173 >/tmp/olen5-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:412,height:915}, deviceScaleFactor:2, isMobile:true, hasTouch:true});
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('console',m=>console.log(`[browser:${m.type()}] ${m.text()}`));
            await page.goto('http://127.0.0.1:4173/olen-5-shell.html?test=1&experienceTest=1&contextTest=1&entitlementTest=1',{waitUntil:'load'});
            await page.waitForFunction(()=>window.__OLEN5_TEST_REPORT__&&window.__OLEN5_EXPERIENCE_TEST_REPORT__&&window.__OLEN5_CONTEXT_TEST_REPORT__&&window.__OLEN5_ENTITLEMENT_TEST_REPORT__,null,{timeout:10000});
            const reports=await page.evaluate(()=>({ui:window.__OLEN5_TEST_REPORT__,experience:window.__OLEN5_EXPERIENCE_TEST_REPORT__,context:window.__OLEN5_CONTEXT_TEST_REPORT__,entitlement:window.__OLEN5_ENTITLEMENT_TEST_REPORT__}));
            console.log('OLEN5_UI_REPORT='+JSON.stringify(reports.ui));
            console.log('OLEN5_EXPERIENCE_REPORT='+JSON.stringify(reports.experience));
            console.log('OLEN5_CONTEXT_REPORT='+JSON.stringify(reports.context));
            console.log('OLEN5_ENTITLEMENT_REPORT='+JSON.stringify(reports.entitlement));
            if(errors.length) console.log('OLEN5_PAGE_ERRORS='+JSON.stringify(errors));
            await browser.close();
            const uiOk=reports.ui&&reports.ui.score==='5/5'&&reports.ui.ok===true;
            const experienceOk=reports.experience&&reports.experience.score==='7/7'&&reports.experience.ok===true;
            const contextOk=reports.context&&reports.context.score==='6/6'&&reports.context.ok===true;
            const entitlementOk=reports.entitlement&&reports.entitlement.score==='8/8'&&reports.entitlement.ok===true;
            if(errors.length || !uiOk || !experienceOk || !contextOk || !entitlementOk) process.exit(1);
          })().catch(err=>{console.error(err);process.exit(1)});
          NODE
