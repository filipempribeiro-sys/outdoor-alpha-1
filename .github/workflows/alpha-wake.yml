name: ALPHA Backend Keep Awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alpha-backend-keep-awake
  cancel-in-progress: true

jobs:
  wake-alpha:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Keep ALPHA backend awake
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="https://alpha-ai-backend-m6l3.onrender.com/api/health"

          echo "ALPHA keep-awake iniciado."
          echo "Cada execução mantém-se ativa entre agendamentos."
          echo

          # O GitHub agenda este workflow de 5 em 5 minutos.
          # Enquanto o próximo run não arrancar, este job continua
          # a fazer ping a cada 3 minutos. Quando o novo run começa,
          # concurrency.cancel-in-progress cancela este e substitui-o.
          #
          # Assim, atrasos do scheduler do GitHub não deixam o Render
          # sem tráfego durante longos intervalos.

          for attempt in 1 2 3 4 5 6; do
            TS="$(date +%s)"
            URL="${BASE_URL}?source=github-actions&attempt=${attempt}&ts=${TS}"

            echo "[$(date -u '+%Y-%m-%dT%H:%M:%SZ')] Ping ${attempt}/6"

            success=0

            for retry in 1 2 3; do
              if curl                 --fail                 --silent                 --show-error                 --location                 --connect-timeout 10                 --max-time 45                 --retry 0                 -H "Accept: application/json"                 -H "Cache-Control: no-cache"                 -H "Pragma: no-cache"                 -H "User-Agent: ALPHA-KeepAlive/3.6.7"                 "$URL"; then

                echo
                echo "Backend ALPHA respondeu."
                success=1
                break
              fi

              echo
              echo "Tentativa ${retry}/3 falhou."
              sleep 5
            done

            if [ "$success" -ne 1 ]; then
              echo "O backend não respondeu neste ciclo; o workflow continuará a tentar."
            fi

            # Não dormir depois do último ciclo.
            if [ "$attempt" -lt 6 ]; then
              echo "Novo ping dentro de 3 minutos..."
              sleep 180
            fi
          done

          echo
          echo "Ciclo keep-awake concluído."