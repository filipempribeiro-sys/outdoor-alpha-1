name: ALPHA Backend Keep Awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wake-alpha:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Ping ALPHA backend
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="https://alpha-ai-backend-m6l3.onrender.com/api/health"
          TS="$(date +%s)"
          URL="${BASE_URL}?source=github-actions&ts=${TS}"

          echo "=============================================="
          echo "ALPHA Backend Keep Awake"
          echo "UTC: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "URL: ${URL}"
          echo "=============================================="

          BODY_FILE="$(mktemp)"

          HTTP_CODE="$(
            curl               --silent               --show-error               --location               --connect-timeout 15               --max-time 60               --retry 2               --retry-delay 5               --retry-all-errors               -H "Accept: application/json"               -H "Cache-Control: no-cache"               -H "Pragma: no-cache"               -H "User-Agent: ALPHA-KeepAlive/3.6.7"               --output "${BODY_FILE}"               --write-out "%{http_code}"               "${URL}"
          )"

          echo
          echo "HTTP STATUS: ${HTTP_CODE}"
          echo "RESPOSTA:"
          cat "${BODY_FILE}" || true
          echo
          echo

          if [[ ! "${HTTP_CODE}" =~ ^2[0-9][0-9]$ ]]; then
            echo "ERRO: o backend ALPHA não respondeu com HTTP 2xx."
            exit 1
          fi

          if ! grep -q '"ok"[[:space:]]*:[[:space:]]*true' "${BODY_FILE}"; then
            echo "ERRO: o endpoint respondeu, mas não confirmou ok:true."
            exit 1
          fi

          echo "SUCESSO: backend ALPHA acordado e /api/health respondeu corretamente."