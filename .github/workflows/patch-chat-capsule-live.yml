name: Patch live chat fullscreen capsule

on:
  push:
    paths:
      - '.github/workflows/patch-chat-capsule-live.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Load OLEN chat fullscreen patch from index
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="olen-4.4.0-chat-sidebar-fullscreen-fix.js?v=440-capsule-2"></script>'
          if tag not in s:
              if '</body>' not in s:
                  raise SystemExit('No </body> found')
              s = s.replace('</body>', tag + '\n</body>', 1)
              p.write_text(s, encoding='utf-8')
      - name: Verify
        shell: bash
        run: grep -F 'olen-4.4.0-chat-sidebar-fullscreen-fix.js?v=440-capsule-2' index.html
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Load OLEN chat fullscreen patch in live index'
          git push origin main
