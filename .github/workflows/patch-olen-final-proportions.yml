name: Patch OLEN final proportions

on:
  push:
    paths:
      - '.github/workflows/patch-olen-final-proportions.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch splash proportions
        shell: python
        run: |
          from pathlib import Path
          p=Path('olen-4.4.0-splash-polish.js')
          s=p.read_text()
          s=s.replace("const BAR_X=58,BAR_Y=1080,BAR_W=604;", "const BAR_X=140,BAR_Y=1080,BAR_W=440;")
          s=s.replace("const V='4.4.0-v107-navigator-tight-gap-bar20';", "const V='4.4.0-v107-columns-width-tagline19-bar20';")
          s=s.replace("ctx.font='700 15px \\\"Segoe UI\\\", Arial, Helvetica, sans-serif';", "ctx.font='700 19px \\\"Segoe UI\\\", Arial, Helvetica, sans-serif';")
          p.write_text(s)
      - name: Verify patch
        shell: bash
        run: |
          grep -F "const BAR_X=140,BAR_Y=1080,BAR_W=440;" olen-4.4.0-splash-polish.js
          grep -F "700 19px" olen-4.4.0-splash-polish.js
          grep -F "OUTDOOR • LIFESTYLE • EXPERIENCE • NAVIGATOR" olen-4.4.0-splash-polish.js
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add olen-4.4.0-splash-polish.js
          git diff --cached --quiet && exit 0
          git commit -m 'OLEN 4.4.0: align loading bar with pillars and enlarge identity line'
          git push origin main
