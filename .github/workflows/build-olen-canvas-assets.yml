name: Build OLEN Canvas assets

on:
  push:
    paths:
      - 'tools/extract_olen_canvas_assets.py'
      - 'assets/olen-splash.png'
      - '.github/workflows/build-olen-canvas-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pillow numpy
      - name: Extract transparent OLEN assets
        run: python tools/extract_olen_canvas_assets.py
      - name: Commit generated PNG assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/olen/*.png
          if git diff --cached --quiet; then
            echo 'No asset changes.'
          else
            git commit -m 'OLEN: generate 14 transparent Canvas assets [skip ci]'
            git push
          fi
